{% extends "base.html" %}

{% load static %}

{% block title %} Home {% endblock %}

{% block content %}

<!-- Banner -->

<div class="container-fluid p-0 mb-5">
    <img 
        src="{% static 'images/food.webp' %}" 
        alt="Food Banner"
        class="img-fluid w-100"
        style="height: 600px; object-fit: cover;"
    >
</div>

<!-- Cards Section -->
<div class="container">

    <div class="row g-4">

        {% for item in food %}

        <!-- 3 cards per row -->
        <div class="col-md-4">

            <div class="card h-100 shadow-lg border-0 rounded-4">

                <!-- Food Image -->
                <img 
                    src="{{ item.image.url }}" 
                    alt="{{ item.name }}"
                    class="card-img-top"
                    style="height: 250px; width: 100%; object-fit: cover;"
                >

                <!-- Card Body -->
                <div class="card-body text-center">

                    <h4 class="fw-bold mb-3">
                        {{ item.name }}
                    </h4>

                    <p class="text-muted">
                        {{ item.description }}
                    </p>

                    <h5 class="text-success fw-bold mb-4">
                        ₹{{ item.price }}
                    </h5>

                    <!-- Quantity Buttons -->
                    <div class="d-flex justify-content-center align-items-center gap-3">

                        <!-- Decrease -->
                        <form class="cart-form" method="POST" action="{% url 'additem' item.id %}">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="decrease">

                            <button class="btn btn-danger rounded-circle px-3">
                                -
                            </button>
                        </form>

                        <!-- Quantity -->
                        <span class="fw-bold fs-5">
                            {{ item.quantity }}
                        </span>

                        <!-- Increase -->
                        <form class="cart-form" method="POST" action="{% url 'additem' item.id %}">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="increase">

                            <button class="btn btn-success rounded-circle px-3">
                                +
                            </button>
                        </form>

                    </div>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
