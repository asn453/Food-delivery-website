{% extends "base.html" %}

{% block title%} sucess {% endblock%}

{% block content %}

<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 80vh;">

    <div class="card shadow-lg border-0 p-5 text-center"
         style="max-width: 500px; width: 100%; border-radius: 20px;">

        <!-- Success Icon -->
        <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success"
               style="font-size: 80px;"></i>
        </div>

        <!-- Success Message -->
        <h1 class="fw-bold text-success">
            Order Placed Successfully!
        </h1>

        <p class="text-muted mt-3 fs-5">
            Thank you for ordering with
            <span class="fw-bold text-dark">Food Express</span>.
        </p>

        <p class="text-muted">
            Your delicious food is being prepared 🍕
        </p>

        <!-- Order Details -->
        <div class="bg-light rounded p-3 mt-4">
            <h5 class="fw-bold">Estimated Delivery</h5>
            <p class="mb-0 text-success">
                30 - 40 Minutes
            </p>
        </div>

        <!-- Buttons -->
        <div class="mt-4 d-flex gap-3 justify-content-center">

            <a href="{% url 'showitem' %}"
               class="btn btn-success px-4">
                Back Home
            </a>

        </div>

    </div>

</div>

{% endblock %}
