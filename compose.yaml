name: Food-Management

services:

  # Django application
  web:
    build:
      context: .

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432

    volumes:
      - media_data:/app/media


  # PostgreSQL database
  db:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER}",
          "-d",
          "${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


# Persistent Docker volumes
volumes:
  postgres_data:
  media_data: